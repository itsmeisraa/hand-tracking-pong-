<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ByteCraft Pong</title>
    <meta name="description" content="2D hand-tracked Pong game powered by MediaPipe Hands.">
    <meta property="og:title" content="ByteCraft Pong">
    <meta property="og:description" content="2D hand-tracked Pong game powered by MediaPipe Hands.">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">

    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils/control_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="masthead">
        <img class="logo" src="logo.svg" alt="ByteCraft">
        <div class="masthead-text">
            <h2>ByteCraft Pong</h2>
            <div class="masthead-sub">
                <span>Computer Vision Arcade</span>
                <span class="sep">·</span>
                <span>Hand-Tracked</span>
                <span class="sep">·</span>
                <span>First to 5 Wins</span>
            </div>
        </div>
    </header>

    <div class="controls-bar">
        <span id="player-badge" class="player-badge" hidden></span>
        <button id="btn-playpause">Start (P)</button>
        <button id="btn-footage">Toggle Footage (V)</button>
        <button id="btn-switch">Switch Sides (S)</button>
        <button id="btn-fullscreen">Fullscreen (F)</button>
        <button id="btn-difficulty">Difficulty: Normal (D)</button>
        <button id="btn-mesh">Hand Mesh: On (M)</button>
        <button id="btn-name">Change Name</button>
    </div>

    <div class="game-layout">
        <div class="container">
            <video class="input_video" width="640" height="480" autoplay playsinline></video>
            <canvas class="output_canvas" width="640" height="480"></canvas>
        </div>

        <div class="side-panel">
            <aside class="scoreboard" aria-label="Scoreboard">
                <div class="score-header">
                    <h3>🏆 Leaderboard</h3>
                    <p class="score-rule"><span id="score-diff-label" class="score-diff">Normal</span> · First to 5 wins</p>
                </div>
                <ol id="score-list" class="score-list">
                    <li class="score-empty">No scores yet — be the first!</li>
                </ol>
                <button id="btn-clear-scores" class="btn-danger">Clear Board</button>
            </aside>

            <div id="name-modal" class="entry-card">
                <h3 id="name-modal-title">Welcome to ByteCraft</h3>
                <p>Enter your player name to join the match:</p>
                <form id="name-form">
                    <input id="player-name-input" type="text" placeholder="Your name (e.g. Alex)" maxlength="20" autocomplete="nickname" required>
                    <button type="submit" id="btn-enter">Enter Court</button>
                </form>
            </div>
        </div>
    </div>

    <div id="gameover-modal" class="modal-overlay" hidden>
        <div class="modal" role="dialog" aria-modal="true" aria-labelledby="gameover-title">
            <div id="gameover-badge" class="winner-trophy">🏆</div>
            <h3 id="gameover-title">Match Over</h3>
            <p id="gameover-score" class="gameover-score"></p>
            <p id="gameover-rally" class="gameover-rally"></p>
            <p id="gameover-rank" class="gameover-rank"></p>
            <button id="btn-newgame">Play Again</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
